/* ================= speak instead of typing =================
   One tap on 🎤: recording starts, stops by itself about one second after the person stops

}
function micDown(e, target, mode, btn) {

}

  if (!o) { o = document.createElement('div'); o.id = 'micov'; document.body.appendChild(o); }
  if (state === 'listen') {
    o.innerHTML = '<div class="micbig pulse">🎤</div><div class="miclbl">' + t('speakNow') + '</div><div class="micbar"><i id="miclv"></i></div>' +
      '<div class="michint">' + (MICP && MICP.up && MICP.up - MICP.down < 450 ? t('micTapDone') : t('micHold')) + '</div>' +
      '<button class="btn red" data-t="micstop" onclick="stopMic(false)">' + t('micStop') + '</button>' +
      '<button class="btn grey slim" data-t="miccancel" onclick="stopMic(true)">' + t('cancel') + '</button>';

'';

function micLevel(v) { var l = $('miclv'); if (l) l.style.width = Math.round(v * 100) + '%'; }

function stopMic(discard) {

    var sent = Date.now();
    call('apiCommand', S.pin, b64, 'audio/wav').then(function (c) {
      micOverlay('');
      if (S.screen !== r.screen) return;
      c = c || {};

      S.vl = { t0: r.started, from: String(r.screen).split(':')[0], heard: c.heard || '', plate: c.plate || '', action: c.action || '', size: c.size || '',
        audioMs: sent - r.started, replyMs: Date.now() - sent, path: [] };

    return;

  call('apiDictate', S.pin, b64, 'audio/wav', r.mode).then(function (x) {
    micOverlay('');

    var el = $(r.target);

    if (r.target === 'nq') return cmdAskGo();

  }).catch(function () { micOverlay(''); alertMsg(t('micNet')); });
}

/* Spoken plate from keyboard voice typing -> MH04AB1234.

  'एक्स': 'X', 'वाय': 'Y', 'झेड': 'Z', 'जेड': 'Z', 'ज़ेड': 'Z',
  'शून्य': '0', 'झिरो': '0', 'जीरो': '0', 'ज़ीरो': '0', 'एक': '1', 'दोन': '2', 'दो': '2', 'तीन': '3', 'चार': '4', 'पाच': '5', 'पांच': '5', 'पाँच': '5',
  'सहा': '6', 'छह': '6', 'छः': '6', 'छे': '6', 'सात': '7', 'आठ': '8', 'नऊ': '9', 'नौ': '9',
  'zero': '0', 'one': '1', 'two': '2', 'three': '3', 'four': '4', 'for': '4', 'five': '5', 'six': '6', 'seven': '7', 'eight': '8', 'nine': '9'

    .split(/[\s,.\-]+/).forEach(function (tok) {

/* Turns what was said ("8899" or a full number) into one vehicle, or a list to choose from. */
function cmdResolve(c, text) {
  var q = norm(text), pool = CMD_POOL[c.action], list = [];

    var all = S.open.filter(pool);
    if (q.length >= 3) list = all.filter(function (o) { return o.plate.indexOf(q) >= 0; }).map(function (o) { return o.plate; });
    if (list.indexOf(q) >= 0) return { plate: q };
    if (list.length === 1) return { plate: list[0] };
    if (!list.length && q.length >= 6) return { plate: q };              // not in the list: cmdDo explains why
    return { list: list.length ? list : all.map(function (o) { return o.plate; }).slice(0, 30) };
  }

/* ================= photo + cloud plate reader ================= */
function onPhoto(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  var img = new Image();
  img.onload = function () {
    var cv = $('cv'), k = Math.min(1, 1600 / Math.max(img.width, img.height));
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(img.src);
    // small copy (about 30-60 KB) that is sent to the reader
    var k2 = Math.min(1, 800 / Math.max(cv.width, cv.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(cv.width * k2)); c.height = Math.max(1, Math.round(cv.height * k2));
    c.getContext('2d').drawImage(cv, 0, 0, c.width, c.height);
    S.thumb = c.toDataURL('image/jpeg', 0.55); S.thumbPlate = '';
    show('<div class="box"><img class="thumb" src="' + S.thumb + '"><div class="huge pulse">🔍</div>' + t('reading') + '</div>' +
      '<button class="btn grey slim" onclick="home()">' + t('cancel') + '</button>', 'reading');
    var timeout = new Promise(function (res) { setTimeout(function () { res({ text: '', error: '', slow: true }); }, 25000); });
    Promise.race([call('apiReadPlate', S.pin, S.thumb.split(',')[1]), timeout]).then(function (r) {
      if (S.screen !== 'reading') return;                 // user cancelled
      var p = plateFrom((r && r.text) || '');
      if (p) { S.thumbPlate = p; vehicleCard(p); }
      else { readFailed(r && r.slow ? t('tooLong') : readerErr(r && r.error)); }
    }).catch(function () { if (S.screen === 'reading') readFailed(t('noNet')); });
  };
  img.onerror = function () { readFailed(''); };
  img.src = URL.createObjectURL(f);
}
function readFailed(msg) {
  buzz([200, 100, 200]); say(t('sReadFail'));
  home(); alertMsg((msg ? msg + '. ' : '') + t('readFail'));
  var q = $('hq'); if (q) q.focus();
}

var STATES = ['MH','GJ','RJ','DL','UP','MP','KA','TN','AP','TS','TG','KL','HR','PB','WB','BR','OD','OR','CG','JH','UK','UA','HP','JK','AS','GA','NL','DN','DD','CH','AR','MN','ML','MZ','SK','TR','PY','LA','AN','LD'];
var D2L = { '0': 'O', '1': 'I', '2': 'Z', '5': 'S', '8': 'B', '6': 'G', '4': 'A', '7': 'T' };
var L2D = { 'O': '0', 'Q': '0', 'D': '0', 'U': '0', 'I': '1', 'L': '1', 'Z': '2', 'S': '5', 'B': '8', 'G': '6', 'T': '7', 'A': '4' };
var PATS = ['LLDDLLDDDD', 'LLDDLDDDD', 'LLDDLLLDDDD', 'LLDLLDDDD', 'LLDDDDDD'];
function coerce(w, pat) {
  var out = '';
  for (var i = 0; i < pat.length; i++) {
    var c = w.charAt(i);
    if (pat.charAt(i) === 'L') {
      if (/[A-Z]/.test(c)) out += c; else if (D2L[c]) out += D2L[c]; else return null;
    } else {
      if (/[0-9]/.test(c)) out += c; else if (L2D[c]) out += L2D[c]; else return null;
    }
  }
  return out;
}
function guessPlate(text) {
  var s = norm(text), fallback = '';
  for (var p = 0; p < PATS.length; p++) {
    var pat = PATS[p];
    for (var i = 0; i + pat.length <= s.length; i++) {
      var c = coerce(s.substr(i, pat.length), pat);
      if (!c) continue;
      if (STATES.indexOf(c.substr(0, 2)) >= 0) return c;
      if (!fallback) fallback = c;
    }
  }
  return fallback;
}
/* Best plate from the reader's answer. Accepts unusual formats too (for example BH-series plates). */
function plateFrom(text) {
  var n = norm(text);
  if (!n || n === 'NONE') return '';
  if (/^[0-9]{2}BH[0-9]{4}[A-Z]{1,2}$/.test(n)) return n;
  if (n.length >= 6 && n.length <= 11 && STATES.indexOf(n.substr(0, 2)) >= 0 && /[0-9]{3,4}$/.test(n)) return n;
  var g = guessPlate(text);
  if (g) return g;
  return (n.length >= 6 && n.length <= 11 && /[0-9]/.test(n)) ? n : '';
}

/* ================= warehouse directory (Parties tab) ================= */
/* "2-8, 12" -> [2..8, 12] */
function galas(spec) {
  var out = [];
  String(spec || '').split(/[,;/ ]+/).forEach(function (part) {
    var m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m) { for (var n = Number(m[1]); n <= Number(m[2]) && out.length < 500; n++) out.push(n); }
    else if (/^\d+$/.test(part)) out.push(Number(part));
  });
  return out;
}
function partyObj(r) { return { name: r[0], mgr: r[1], phone: r[2], b: r[3], spec: r[4], g: galas(r[4]) }; }
/* Parties for a building + unit, or for a company name */
function partyFor(b, u, co) {
  var P = S.D.parties || [], n = Number(u), c = String(co || '').trim().toUpperCase();
  var hit = P.filter(function (p) { return b && p.b === b && (!u || p.g.indexOf(n) >= 0); });
  if (u && hit.length) return hit;
  if (c) { var byName = P.filter(function (p) { return p.name.toUpperCase() === c; }); if (byName.length) return byName; }
  return b && !u ? [] : hit;
}
function digits(ph) { var d = String(ph || '').replace(/[^0-9]/g, ''); return d.length > 10 && d.indexOf('91') === 0 ? d.slice(-10) : d; }
function callBtn(ph, tag) { var d = digits(ph); return d ? '<a class="btn green slim callb" data-t="' + (tag || 'call') + '" href="tel:+91' + d + '">📞 ' + d + '</a>' : ''; }
function waBtn(ph, msg, tag) { var d = digits(ph); return d ? '<a class="btn slim wab" data-t="' + (tag || 'wa') + '" target="_blank" rel="noopener" href="https://wa.me/91' + d + (msg ? '?text=' + encodeURIComponent(msg) : '') + '">💬 WhatsApp</a>' : ''; }
/* p.show = false (guards): the number is not written on the screen and there is no WhatsApp, only a call button. */
function partyBox(p) {
  var show = p.show !== false;
  return '<div class="box party" style="text-align:left"><b>' + esc(p.name) + '</b><br><small>🏢 ' + esc(p.b) + (p.spec ? ' · ' + t('gala') + ' ' + esc(p.spec) : '') +

    '<button class="btn plain slim" data-t="pfix" onclick="dirFix(\'' + esc(p.name).replace(/'/g, '&#39;') + '\')">' + t('dirFix') + '</button></div>';

function act(kind, plate, cat) {
  var o = findOpen(plate), tm = now();
  if ((kind === 'pend' || kind === 'setcat' || kind === 'untick') && !can('park')) { alertMsg(t('noPerm')); return; }

  if (kind === 'entry') {
    if (o) { alertMsg(t('already')); return; }
    var inf = S.entryInfo || entryInfo(); S.entryInfo = inf;
    if (!plateOK(plate) && !S.okUnusual[plate]) return unusualScreen(plate, cat);
    S.entryInfo = null;
    return doEntry(plate, cat, inf, tm);
  }
  if (kind === 'undo') {
    S.mut++; delete S.vinfo[plate];
    busy(t('undoing'));
    return waitIdle().then(function () { return call('apiUndo', S.pin, plate); }).then(function (r) {
      applySync(r.sync);
      doneScreen(plate, '<div class="huge" style="color:#0b3d91">↩️ ✔</div>' + t('backInside'), t('sOk'));
    }).catch(function (e) { fail(e, "vehicleCard('" + plate + "')"); });
  }
  if (!o) { alertMsg(t('notInside')); return; }
  S.mut++;
  if (kind === 'pend') {
    o.pmin = runMin(o, tm); o.status = 'INSIDE'; o.pend = tm; o.seen = tm; delete S.vinfo[plate];
    savePhoto(plate, 'PARKEND');
    doneScreen(plate, catTag(o.cat) + '<div class="huge" style="color:#333">🅿️✖ ✔</div>' + t('sPend') + ' · <b>' + dur(o.pmin) + '</b>', t('sPend'));
    return bg('🅿️✖ ' + plate, 'apiPark', [plate, 'end', tm]);
  }
  if (kind === 'cancel') {
    dropOpen(plate); delete S.vinfo[plate]; S.today = Math.max(0, S.today - 1);
    doneScreen(plate, '<div class="huge" style="color:#0a6b2d">🗑 ✔</div>' + t('deleted'), t('deleted'));
    return bg('🗑 ' + plate, 'apiCancelEntry', [plate]);
  }
  if (kind === 'untick') {
    var k = o.tickets.pop(); o.paidUntil = o.tickets.length ? o.tickets[o.tickets.length - 1].u : null; delete S.vinfo[plate];
    bg('🎫✖ ' + plate, 'apiTicketUndo', [plate]);
    return renderCard(plate, false, t('untickDone', k.n, k.a));
  }
  if (kind === 'setcat') {
    o.cat = cat; S.D.known[plate] = cat; delete S.vinfo[plate];
    bg('⚙️ ' + plate, 'apiSetCat', [plate, cat]);
    return renderCard(plate, false, t('sizeChanged', catName(cat)));
  }
  if (kind === 'left') {
    dropOpen(plate); delete S.vinfo[plate];
    bg('✖ ' + plate, 'apiCloseLeft', [plate, tm]);
    return renderCard(plate, false, t('leftDone'));
  }
  if (kind === 'exit') {
    if (isFresh(plate)) return exitPreview(plate);
    busy(t('calc'));
    waitIdle().then(function () { return fetchVehicle(plate); }).then(function (v) {
      if (v.open) exitPreview(plate); else { renderCard(plate); alertMsg(t('alreadyOut')); }
    }).catch(function (e) { fail(e, "vehicleCard('" + plate + "')"); });
  }
}

function savePhoto(plate, action) {

    var name = plate + '_' + action + '_' + ymd(ist(now())).replace(/-/g, '') + '_' + hhmm(now()).replace(':', '') + '.jpg';
    cv.toBlob(function (b) {
      if (!b) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      cv.width = 0; cv.height = 0; S.thumb = ''; S.thumbPlate = '';
    }, 'image/jpeg', 0.6);
  } catch (e) {}

  if (k === 'week') { a.setUTCDate(a.getUTCDate() - ((a.getUTCDay() + 6) % 7)); }
  if (k === 'month') { a.setUTCDate(1); }
  if (k === 'lastmonth') { a = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth() - 1, 1)); b = new Date(Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), 0)); }
  if (k === 'year') { a = new Date(Date.UTC(a.getUTCFullYear(), 0, 1)); }
  if (k === '30') { a.setUTCDate(a.getUTCDate() - 29); }
  return [ymd(a), ymd(b)];
}

/* ================= ADVANCED ANALYTICS (superuser) ================= */
/* Row layout from the server: 0 plate, 1 size, 2 type, 3 entry ms, 4 exit ms, 5 parked min, 6 fee, 7 tickets,
   8 overdue min at exit, 9 status, 10 note, 11 entry by, 12 exit by, 13 serial, 14 (unused), 15 parking by,
   16 going to building, 17 parked near, 18 company */
function anHome() { anLoad(range('month')); }
function anLoad(r) {
  busy(t('loadingData'));
  call('apiAnalytics', S.pin, r[0], r[1]).then(function (d) {
    S.an = { d: d, f: { cat: '', st: '', staff: '', q: '' }, sort: 3, desc: true, page: 0 };
    anShow();
  }).catch(function (e) { fail(e, 'logsHome()'); });
}
function anStatus(r) {
  if (r[9] === 'CANCELLED') return 'DEL';
  if (r[9] === 'INSIDE' || r[9] === 'PARKED') return 'IN';
  if (String(r[10]).indexOf('LEFT') === 0) return 'LEFT';
  return 'OUT';
}
function anRows() {
  var a = S.an, f = a.f, q = norm(f.q);
  return a.d.rows.filter(function (r) {
    if (f.cat && r[1] !== f.cat) return false;
    if (f.st === 'EX') { if (r[2] !== 'TENANT' && r[2] !== 'PASS') return false; }
    else if (f.st === 'PK') { if (!(r[5] > 0 || r[7] > 0)) return false; }
    else if (f.st === 'OD') { if (!(r[8] > 0)) return false; }
    else if (f.st && anStatus(r) !== f.st) return false;
    if (f.staff && r[11] !== f.staff && r[12] !== f.staff && r[15] !== f.staff) return false;
    if (q && r[0].indexOf(q) < 0) return false;
    return true;
  });
}
/* Simple bar chart drawn as SVG. items: [[label, value], ...] */
function bars(title, items, rupees) {
  if (!items.length) return '';
  var max = 1, Wd = 320, H = 130, n = items.length, bw = (Wd - 10) / n, s = '';
  items.forEach(function (it) { if (it[1] > max) max = it[1]; });
  var step = Math.ceil(n / 8);
  items.forEach(function (it, i) {
    var bh = Math.round(it[1] / max * (H - 34)), x = 5 + i * bw;
    s += '<rect x="' + x.toFixed(1) + '" y="' + (H - 18 - bh) + '" width="' + Math.max(1, bw - 2).toFixed(1) + '" height="' + bh + '" fill="#1f5fbf"><title>' + esc(it[0]) + ': ' + it[1] + '</title></rect>';
    if (i % step === 0) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 5) + '" font-size="9" text-anchor="middle" fill="#555">' + esc(it[0]) + '</text>';
    if (n <= 12 && it[1]) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 21 - bh) + '" font-size="9" text-anchor="middle" fill="#111">' + it[1] + '</text>';
  });
  return '<div class="chart"><b>' + title + '</b> <small>(' + t('max') + ' ' + (rupees ? '₹' : '') + max + ')</small><svg viewBox="0 0 ' + Wd + ' ' + H + '" width="100%">' + s + '</svg></div>';
}
function anShow() {
  var a = S.an, d = a.d, rows = anRows(), f = a.f;
  var fees = 0, tks = 0, over = 0, parked = 0, pmin = 0, left = 0, leftRs = 0, del = 0, inside = 0, heavy = 0;
  var byDay = {}, byHour = [], staff = {}, veh = {}, bld = {}, near = {}, i;
  for (i = 0; i < 24; i++) byHour.push(0);
  var st = function (n) { if (!n) n = '—'; if (!staff[n]) staff[n] = { e: 0, x: 0, fee: 0, p: 0 }; return staff[n]; };
  var longRange = (new Date(d.to) - new Date(d.from)) / 86400000 > 45;
  rows.forEach(function (r) {
    var s = anStatus(r), dt = ist(r[3]), key = longRange ? MON[dt.getUTCMonth()] + ' ' + dt.getUTCFullYear() : dmon(dt);
    if (!byDay[key]) byDay[key] = { n: 0, fee: 0, t: r[3] };
    if (s === 'DEL') { del++; return; }
    byDay[key].n++; byDay[key].fee += r[6]; byHour[dt.getUTCHours()]++;
    fees += r[6]; tks += r[7]; if (r[8] > 0) over++;
    if (r[5] > 0 || r[7] > 0) { parked++; pmin += r[5]; }
    if (r[16]) bld[r[16]] = (bld[r[16]] || 0) + 1; if (r[17]) { if (!near[r[17]]) near[r[17]] = { n: 0, fee: 0 }; near[r[17]].n++; near[r[17]].fee += r[6]; }
    if (s === 'LEFT') { left++; leftRs += r[6]; }
    if (s === 'IN') inside++;
    if (r[1] === 'HEAVY') heavy++;
    st(r[11]).e++; if (r[12] && s !== 'IN') { st(r[12]).x++; st(r[12]).fee += r[6]; } if (r[15]) st(r[15]).p++;
    if (!veh[r[0]]) veh[r[0]] = { n: 0, fee: 0 }; veh[r[0]].n++; veh[r[0]].fee += r[6];
  });
  var total = rows.length - del;
  var names = {}; d.rows.forEach(function (r) { [r[11], r[12], r[15]].forEach(function (n) { if (n) names[n] = 1; }); });
  var opt = function (v, label, cur) { return '<option value="' + esc(v) + '"' + (cur === v ? ' selected' : '') + '>' + esc(label) + '</option>'; };
  var pb = function (k, key) { return '<button class="btn plain slim" style="margin:4px 0" onclick="anLoad(range(\'' + k + '\'))">' + t(key) + '</button>'; };
  var h = '<h1>' + t('analytics') + '</h1><div class="msg info">' + dstr(d.from) + ' → ' + dstr(d.to) + (d.capped ? ' · ' + t('capped') : '') + '</div>' +
    '<div class="row2">' + pb('today', 'pToday') + pb('week', 'pWeek') + pb('month', 'pMonth') + '</div><div class="row2">' + pb('30', 'p30') + pb('lastmonth', 'pLast') + pb('year', 'pYear') + '</div>' +
    '<div class="row2"><input id="af" type="date" value="' + d.from + '"><input id="at" type="date" value="' + d.to + '"><button class="btn slim" style="flex:0 0 60px;margin:0" onclick="anLoad([$(\'af\').value,$(\'at\').value])">▶</button></div>' +
    '<h2>' + t('filters') + '</h2><div class="row2"><select id="fc" onchange="anSet()">' + opt('', t('allSizes'), f.cat) + opt('MEDIUM', t('c_MEDIUM'), f.cat) + opt('HEAVY', t('c_HEAVY'), f.cat) + '</select>' +
    '<select id="fs" onchange="anSet()">' + opt('', t('allStatus'), f.st) + opt('IN', t('stIn'), f.st) + opt('OUT', t('stOut'), f.st) + opt('PK', t('stPk'), f.st) + opt('LEFT', t('stLeft'), f.st) + opt('DEL', t('stDel'), f.st) + opt('EX', t('stEx'), f.st) + opt('OD', t('stOd'), f.st) + '</select></div>' +
    '<div class="row2" style="margin-top:8px"><select id="fp" onchange="anSet()">' + opt('', t('allStaff'), f.staff) + Object.keys(names).map(function (n) { return opt(n, n, f.staff); }).join('') + '</select>' +
    '<input id="fq" class="up note" type="text" placeholder="' + t('vehNo') + '" value="' + esc(f.q) + '" onchange="anSet()"></div>';
  var kpi = function (v, l) { return '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>'; };
  h += '<h2>' + t('summaryH') + '</h2><div class="kpis">' + kpi(total, t('vehicles')) + kpi('₹' + fees, t('kFees')) + kpi(tks, t('kTk')) + kpi(over, t('kOd')) + kpi(parked + ' (' + (total ? Math.round(parked * 100 / total) : 0) + '%)', t('kPk')) +
    kpi(dur(parked ? Math.round(pmin / parked) : 0), t('kAvg')) + kpi('₹' + (parked ? Math.round(fees / parked) : 0), t('kFpp')) +
    kpi(left + ' · ₹' + leftRs, t('kLeft')) + kpi(heavy + ' / ' + (total - heavy), t('kHm')) + kpi(inside, t('kIn')) + kpi(del + ' · ' + d.review.length, t('kDel')) + '</div>';
  var days = Object.keys(byDay).sort(function (x, y) { return byDay[x].t - byDay[y].t; });
  h += bars(longRange ? t('chFeeMon') : t('chFeeDay'), days.map(function (k) { return [k, byDay[k].fee]; }), true) +
    bars(longRange ? t('chVehMon') : t('chVehDay'), days.map(function (k) { return [k, byDay[k].n]; })) +
    bars(t('chHour'), byHour.map(function (v, i2) { return [String(i2), v]; }));
  h += '<h2>' + t('staff') + '</h2><table><tr><th>' + t('name') + '</th><th>⬇️</th><th>🅿️</th><th>⬆️</th><th>₹</th></tr>' + Object.keys(staff).map(function (n) {
    var z = staff[n]; return '<tr><td>' + esc(n) + '</td><td>' + z.e + '</td><td>' + z.p + '</td><td>' + z.x + '</td><td>' + z.fee + '</td></tr>'; }).join('') + '</table>';
  var bk = function (o) { return Object.keys(o).sort(function (x, y) { return S.D.buildings.indexOf(x) - S.D.buildings.indexOf(y); }); };
  if (Object.keys(bld).length) h += bars(t('chBld'), bk(bld).map(function (k) { return [k, bld[k]]; }));
  if (Object.keys(near).length) h += '<h2>' + t('nearH') + '</h2><table><tr><th>🅿️</th><th>' + t('times') + '</th><th>₹</th></tr>' + bk(near).map(function (k) {
    return '<tr><td>' + esc(k) + '</td><td>' + near[k].n + '</td><td>' + near[k].fee + '</td></tr>'; }).join('') + '</table>';
  var top = Object.keys(veh).sort(function (x, y) { return veh[y].fee - veh[x].fee || veh[y].n - veh[x].n; }).slice(0, 10);
  h += '<h2>' + t('topVeh') + '</h2><table><tr><th>' + t('colVeh') + '</th><th>' + t('times') + '</th><th>₹</th></tr>' + top.map(function (p) {
    return '<tr><td><a href="#" onclick="vehicleCard(\'' + p + '\');return false">' + p + '</a></td><td>' + veh[p].n + '</td><td>' + veh[p].fee + '</td></tr>'; }).join('') + '</table>';
  // sortable table
  var cols = [[0, t('colVeh')], [1, t('colSize')], [3, t('colIn')], [4, t('colOut')], [5, t('colPk')], [7, '🎫'], [6, '₹'], [16, '🏢'], [11, t('colBy')]];
  rows.sort(function (x, y) { var u = x[a.sort], v = y[a.sort]; if (u == null) u = 0; if (v == null) v = 0; return (u < v ? -1 : u > v ? 1 : 0) * (a.desc ? -1 : 1); });
  var per = 50, pages = Math.max(1, Math.ceil(rows.length / per));
  if (a.page >= pages) a.page = 0;
  h += '<h2>' + t('allRows') + ' — ' + rows.length + '</h2><div class="scroll"><table><tr>' + cols.map(function (c) {
    return '<th class="s" onclick="anSort(' + c[0] + ')">' + c[1] + (a.sort === c[0] ? (a.desc ? ' ▼' : ' ▲') : '') + '</th>'; }).join('') + '</tr>' +
    rows.slice(a.page * per, a.page * per + per).map(function (r) {
      var s = anStatus(r);
      return '<tr><td><a href="#" onclick="vehicleCard(\'' + r[0] + '\');return false">' + r[0] + '</a>' + (s === 'LEFT' ? ' ✖' : s === 'DEL' ? ' 🗑' : s === 'IN' ? ' ●' : '') + '</td><td>' + catName(r[1]) + '</td><td>' + fmt(r[3]) +
        '</td><td>' + (r[4] ? fmt(r[4]) : '—') + '</td><td>' + r[5] + '</td><td>' + r[7] + (r[8] > 0 ? ' ⚠' : '') + '</td><td>' + r[6] + '</td><td>' + esc(r[16]) + '</td><td>' + esc(r[11]) + '</td></tr>'; }).join('') + '</table></div>' +
    '<div class="row2"><button class="btn plain slim" onclick="anPage(-1)">◀</button><div class="box" style="margin:10px 0;padding:12px">' + (a.page + 1) + ' / ' + pages + '</div><button class="btn plain slim" onclick="anPage(1)">▶</button></div>' +
    '<button class="btn dark slim" data-t="csv" onclick="anCsv()">' + t('csv') + '</button>' +
    '<h2>' + t('totalsH') + '</h2><div class="box" data-t="totals">' + t('totals', d.totalEver) + '</div>' +
    '<button class="btn grey slim" onclick="logsHome()">' + t('back') + '</button>';
  var y = window.scrollY, keep = S.screen === 'analytics';
  show(h, 'analytics');
  if (keep) window.scrollTo(0, y);
}
function anSet() { var f = S.an.f; f.cat = $('fc').value; f.st = $('fs').value; f.staff = $('fp').value; f.q = $('fq').value; S.an.page = 0; anShow(); }
function anSort(c) { var a = S.an; if (a.sort === c) a.desc = !a.desc; else { a.sort = c; a.desc = true; } a.page = 0; anShow(); }
function anPage(n) { var a = S.an, pages = Math.max(1, Math.ceil(anRows().length / 50)); a.page = Math.min(pages - 1, Math.max(0, a.page + n)); anShow(); }
function anCsv() {
  var head = ['Vehicle', 'Size', 'Type', 'Entry', 'Exit', 'Parked min', 'Fee', 'Tickets', 'Overdue min', 'Status', 'Note', 'Entry by', 'Exit by', 'Serial', '', 'Parking by', 'Going to building', 'Parked near', 'Company'];
  var iso = function (tm) { return tm ? ymd(ist(tm)) + ' ' + hhmm(tm) : ''; };
  var lines = [head.join(',')].concat(anRows().map(function (r) {
    return r.map(function (v, i) { if (i === 3 || i === 4) v = iso(v); v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
  }));
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv' }));
    a.download = 'globe_parking_' + S.an.d.from + '_' + S.an.d.to + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alertMsg(t('dlFail')); }
}

/* ================= VOICE LOG (superuser) ================= */
/* Row layout: 0 time, 1 staff, 2 role, 3 language, 4 screen, 5 heard, 6 number heard, 7 action, 8 size, 9 vehicle used,
   10 steps, 11 result, 12 detail, 13 speech ms, 14 reply ms, 15 total ms, 16 flag */
function vlScreen() {
  busy();
  call('apiVoiceLogs', S.pin, 300).then(function (d) { S.vlog = { d: d, only: false }; vlShow(); }).catch(function (e) { fail(e); });
}
function vlShow() {
  var v = S.vlog, rows = v.d.rows, n = { OK: 0, SLOW: 0, PROBLEM: 0 };
  rows.forEach(function (r) { n[r[16]] = (n[r[16]] || 0) + 1; });
  var list = v.only ? rows.filter(function (r) { return r[16] !== 'OK'; }) : rows;
  var secs = function (ms) { return (Math.round(ms / 100) / 10) + ' ' + t('sec'); };
  var col = { OK: '#0a6b2d', SLOW: '#b35600', PROBLEM: '#a31515' };
  var h = '<h1>' + t('voiceLog') + '</h1><div class="msg info">' + t('vlShown', rows.length, v.d.total) + '</div>' +
    '<div class="kpis"><div class="kpi"><b style="color:' + col.OK + '">' + n.OK + '</b><span>' + t('f_OK') + '</span></div><div class="kpi"><b style="color:' + col.SLOW + '">' + n.SLOW + '</b><span>' + t('f_SLOW') + '</span></div>' +
    '<div class="kpi"><b style="color:' + col.PROBLEM + '">' + n.PROBLEM + '</b><span>' + t('f_PROBLEM') + '</span></div></div>' +
    '<div class="row2"><button class="btn ' + (v.only ? 'plain' : 'dark') + ' slim" data-t="vl-all" onclick="S.vlog.only=false;vlShow()">' + t('vlAll') + '</button>' +
    '<button class="btn ' + (v.only ? 'dark' : 'plain') + ' slim" data-t="vl-prob" onclick="S.vlog.only=true;vlShow()">' + t('vlProb') + '</button></div>' +
    '<button class="btn dark slim" data-t="vl-csv" onclick="vlCsv()">' + t('csv') + '</button>';
  if (!list.length) h += '<div class="msg info">' + t('noRec') + '</div>';
  list.slice(0, 150).forEach(function (r) {
    var steps = String(r[10] || '').split('>').filter(Boolean).map(function (x) { return tk('vs_', x); }).join(' → ');
    h += '<div class="box vl" style="text-align:left;border-left:10px solid ' + (col[r[16]] || '#000') + '"><small>' + fmt(r[0]) + ' · ' + esc(r[1]) + ' · ' + secs(r[15]) + ' (' + secs(r[14]) + ')</small>' +
      '<br><b>“' + esc(r[5] || '—') + '”</b>' +
      '<br>' + t('vlUnderstood') + ': ' + (r[7] && r[7] !== 'NONE' ? cmdLabel({ action: r[7] }) : '—') + (r[6] ? ' · ' + esc(r[6]) : '') + (r[8] ? ' · ' + catName(r[8]) : '') +
      (r[9] && r[9] !== r[6] ? '<br>' + t('vlUsed') + ': <b>' + esc(r[9]) + '</b>' : '') +
      (steps ? '<br>' + t('vlSteps') + ': ' + steps : '') +
      '<br><b style="color:' + (col[r[16]] || '#000') + '">' + tk('vr_', r[11]) + '</b>' + (r[12] ? ' · ' + esc(r[12]) : '') + '</div>';
  });
  show(h + '<button class="btn grey slim" onclick="home()">' + t('back') + '</button>', 'voicelog');
}
function vlCsv() {
  busy();
  call('apiVoiceLogs', S.pin, 3000).then(function (d) {
    var head = ['Time (IST)', 'Staff', 'Role', 'Language', 'Screen', 'Heard', 'Number heard', 'Action', 'Size', 'Vehicle used', 'Steps', 'Result', 'Detail', 'Speech ms', 'Reply ms', 'Total ms', 'Flag'];
    var lines = [head.join(',')].concat(d.rows.map(function (r) {
      return r.map(function (x, i) { if (i === 0) x = x ? ymd(ist(x)) + ' ' + hhmm(x) : ''; x = x == null ? '' : String(x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(',');
    }));
    vlShow();
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }));
      a.download = 'globe_voice_log_' + ymd(ist(now())) + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { alertMsg(t('dlFail')); }
  }).catch(function (e) { fail(e); });
}

(function () {
