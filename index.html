  .plain { background: #fff; color: #1f5fbf; border: 2px solid #1f5fbf; }
  .slim { padding: 13px 10px; font-size: 18px; }
  .last { outline: 5px solid #f4c20d; }
  input[type=text], input[type=tel], input[type=password], input[type=date], select { width: 100%; font-size: 26px; padding: 12px; border: 2px solid #99a;

  .huge { font-size: 44px; font-weight: bold; margin: 6px 0; line-height: 1.2; }
  .plate { font-size: 30px; font-weight: bold; letter-spacing: 2px; font-family: Arial, sans-serif; }

  td, th { padding: 9px 6px; border-bottom: 1px solid #e3e6ea; text-align: right; font-size: 16px; }
  td:first-child, th:first-child { text-align: left; }
  th.s { cursor: pointer; color: #1f5fbf; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 15px; color: #555; }
  .nav button { border: 0; background: #223; color: #fff; font-size: 17px; font-weight: bold; padding: 10px 16px; border-radius: 10px; }
  .row2 { display: flex; gap: 8px; align-items: stretch; } .row2 > * { flex: 1; }
  label.f { display: block; font-size: 14px; color: #555; margin: 8px 0 4px; text-align: left; }
  .tiles { display: flex; gap: 8px; margin: 10px 0; }
  .tile { flex: 1; background: #fff; border: 2px solid #ccd; border-radius: 14px; padding: 10px 4px; text-align: center; cursor: pointer; }
  .tile .n { font-size: 34px; font-weight: bold; } .tile .l { font-size: 15px; color: #333; }

  .thumb { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 8px; }
  .pulse { animation: pulse 1s infinite; } @keyframes pulse { 50% { opacity: 0.35; } }
  .fullred { background: #c0392b; color: #fff; border-radius: 14px; padding: 20px; text-align: center; margin: 10px 0; }

  .mic { flex: 0 0 64px !important; margin: 0; padding: 0; font-size: 28px; }
  .mic.on { background: #c0392b; }

  .scroll { overflow-x: auto; }
  .langsel { width: auto !important; font-size: 15px !important; padding: 6px 4px !important; border: 1px solid #99a !important; border-radius: 8px !important; }
  a.btn { text-decoration: none; }

function noteName(n) {
  n = String(n || '');
  if (n.indexOf('LEFT') === 0) return t('n_LEFT');
  if (n.indexOf('ENTRY DELETED') === 0) return t('n_DELETED');
  if (n.indexOf('NO SLIP') === 0) return t('n_NOSLIP');

}
function markSeenCard(plate) { var o = findOpen(plate); if (o) o.seen = now(); S.mut++; bg('✔ ' + plate, 'apiSeen', [plate]); renderCard(plate); }

/* ================= ACTIONS (screen changes at once, saving happens behind) ================= */
function doneScreen(plate, body, speak, extra) {
  buzz(60); if (speak) say(speak);
  S.last = plate;
  show('<div class="box"><div class="plate">' + esc(plate) + '</div>' + body + '</div>' + (extra || '') +
    '<button class="btn dark" id="okbtn" data-t="ok"><span class="ico">✔</span>' + t('nextVeh') + '</button>' +
    '<button class="btn plain slim" id="again" data-t="again">' + t('openAgain') + '</button>', 'done');
  $('okbtn').onclick = home;
  $('again').onclick = function () { vehicleCard(plate); };
}
function act(kind, plate, cat) {
  var o = findOpen(plate), tm = now();
  if ((kind === 'pstart' || kind === 'pend' || kind === 'setcat') && !can('park')) { alertMsg(t('noPerm')); return; }

  if (kind === 'entry') {
    if (o) { alertMsg(t('already')); return; }
    if (S.D.exempt[plate]) return doEntry(plate, cat, '', tm);            // exempt: no payment step
    if (S.slips.length) return payScreen(plate, cat);
    busy(t('gettingSlip'));
    return topUpSlips().then(function () {
      if (S.slips.length) payScreen(plate, cat); else fail(new Error(t('noNetRetry')), "vehicleCard('" + plate + "')");
    });
  }
  if (kind === 'undo') {
    S.mut++; delete S.vinfo[plate];
    busy(t('undoing'));
    return waitIdle().then(function () { return call('apiUndo', S.pin, plate); }).then(function (r) {
      applySync(r.sync);
      var money = '', speak = t('sOk');
      if (r.what === 'ENTRY DELETED') { if (r.deposit > 0) { money = '<div class="huge" style="color:#d9780a">' + t('takeAgain', r.deposit) + '</div>'; speak = t('sTakeAgain', r.deposit); } }
      else if (r.refund > 0) { money = '<div class="huge" style="color:#c0392b">' + t('takeBack', r.refund) + '</div>'; speak = t('sTakeBack', r.refund); }
      else if (r.refund < 0) { money = '<div class="huge" style="color:#1c8a4a">' + t('giveBack', -r.refund) + '</div>'; speak = t('sGiveBack', -r.refund); }
      doneScreen(plate, '<div class="huge" style="color:#1f5fbf">↩️ ✔</div>' + t('backInside') + money, speak);
    }).catch(function (e) { fail(e, "vehicleCard('" + plate + "')"); });
  }
  if (!o) { alertMsg(t('notInside')); return; }
  S.mut++;
  if (kind === 'pstart') {
    o.status = 'PARKED'; o.pstart = tm; o.pend = null; o.seen = tm; delete S.vinfo[plate];
    savePhoto(plate, 'PARKSTART');
    doneScreen(plate, catTag(o.cat) + '<div class="huge" style="color:#d9780a">🅿️ ✔</div>' + t('sPstart') + ' · ' + hhmm(tm), t('sPstart'));
    return bg('🅿️ ' + plate, 'apiPark', [plate, 'start', tm]);
  }
  if (kind === 'pend') {
    o.pmin = runMin(o, tm); o.status = 'INSIDE'; o.pend = tm; o.seen = tm; delete S.vinfo[plate];
    savePhoto(plate, 'PARKEND');
    doneScreen(plate, catTag(o.cat) + '<div class="huge" style="color:#5d6b7a">🅿️✖ ✔</div>' + t('sPend') + ' · <b>' + dur(o.pmin) + '</b>', t('sPend'));
    return bg('🅿️✖ ' + plate, 'apiPark', [plate, 'end', tm]);
  }
  if (kind === 'cancel') {
    var dep = o.deposit;
    dropOpen(plate); delete S.vinfo[plate]; S.today = Math.max(0, S.today - 1);
    doneScreen(plate, '<div class="huge" style="color:#1c8a4a">🗑 ✔</div>' + t('deleted') +
      (dep > 0 ? '<div class="huge" style="color:#1c8a4a">' + t('giveBack', dep) + '</div>' + t('takeSlipBack') : ''), dep > 0 ? t('sGiveBack', dep) : t('deleted'));
    return bg('🗑 ' + plate, 'apiCancelEntry', [plate]);
  }
  if (kind === 'setcat') {
    o.cat = cat; S.D.known[plate] = cat; delete S.vinfo[plate];
    bg('⚙️ ' + plate, 'apiSetCat', [plate, cat]);
    return renderCard(plate, false, t('sizeChanged', catName(cat)));
  }
  if (kind === 'left') {
    var kept = o.deposit;
    dropOpen(plate); delete S.vinfo[plate];
    bg('✖ ' + plate, 'apiCloseLeft', [plate, tm]);
    return renderCard(plate, false, t('leftDone', kept));
  }
  if (kind === 'exit') {
    // Money is involved, so the numbers must come from the server's latest record.
    if (isFresh(plate)) return exitPreview(plate);
    busy(t('calc'));
    waitIdle().then(function () { return fetchVehicle(plate); }).then(function (v) {
      if (v.open) exitPreview(plate); else { renderCard(plate); alertMsg(t('alreadyOut')); }
    }).catch(function (e) { fail(e, "vehicleCard('" + plate + "')"); });
  }
}
/* Step before the entry is made: take the money first. */
function payScreen(plate, cat) {
  var dep = S.D.deposits[cat], slip = S.slips[0], tm = now();

function doEntry(plate, cat, slip, tm) {
  var ex = S.D.exempt[plate], type = ex ? ex.type : 'DEPOSIT', dep = type === 'DEPOSIT' ? S.D.deposits[cat] : 0;
  S.mut++; S.today++;
  S.open.push({ row: null, plate: plate, status: 'INSIDE', cat: cat, type: type, slip: slip, deposit: dep, entry: tm, entryBy: S.user.name, pstart: null, pend: null, pmin: 0, banked: 0, seen: null });
  S.D.known[plate] = cat; delete S.vinfo[plate];
  savePhoto(plate, 'ENTRY');
  var park = can('park') ? '<button class="btn orange" data-t="pstart" onclick="act(\'pstart\',\'' + plate + '\')"><span class="ico">🅿️</span>' + t('bPstart') + '</button>' : '';
  if (dep > 0) doneScreen(plate, catTag(cat) + '<div class="huge" style="color:#1c8a4a">⬇️ ✔</div>🧾 <b>' + slip + '</b> · ₹' + dep + ' · ' + hhmm(tm), t('sEntrySlip'), park);
  else doneScreen(plate, catTag(cat) + '<div class="huge" style="color:#1c8a4a">⬇️ ✔</div><b>' + t('noMoney') + '</b> · ' + tk('ty_', type) + (ex && ex.note ? ' — ' + esc(ex.note) : ''), t('sNoMoney'), park);
  bg('⬇️ ' + plate, 'apiEntry', [plate, cat, slip, tm], function (r) {

    if (r.deposit !== dep) correction('<div class="plate">' + esc(plate) + '</div>' + t('corrDep', r.deposit, dep));
    else if (dep > 0 && String(r.slip) !== String(slip)) correction('<div class="plate">' + esc(plate) + '</div>' + t('corrSlip') + '<div class="huge">' + esc(r.slip) + '</div>');
  });
}

/* Returns [big coloured instruction, small explanation, sentence to speak]. */
function money(x) {
  if (x.noSlip && x.refund === 0 && x.deposit > 0) return ['<div class="huge" style="color:#d9780a">' + t('noSlipNoRef') + '</div>', t('noSlipSub', x.deposit), t('sNoSlip')];
  if (x.refund > 0) return ['<div class="huge" style="color:#1c8a4a">' + t('giveBack', x.refund) + '</div>', t('takeSlipBack'), t('sGiveBack', x.refund)];
  if (x.refund < 0 && x.deposit > 0) return ['<div class="huge" style="color:#c0392b">' + t('collectMore', -x.refund) + '</div>', t('collectMoreSub', x.fee, x.deposit), t('sCollectMore', -x.refund)];
  if (x.refund < 0) return ['<div class="huge" style="color:#c0392b">' + t('take', -x.refund) + '</div>', t('collectSub'), t('sTake', -x.refund)];
  if (x.deposit > 0) return ['<div class="huge" style="color:#d9780a">' + t('noRefund') + '</div>', t('noRefundSub', x.deposit), t('sNoRefund')];
  return ['<div class="huge" style="color:#1c8a4a">' + t('nothing') + '</div>', tk('ty_', x.type), t('sNothing')];
}

/* ================= photo saved on this phone ================= */
function savePhoto(plate, action) {
  try {
    var cv = $('cv');
    if (!cv.width || S.thumbPlate !== plate) return;
    var d = new Date();
    var name = plate + '_' + action + '_' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.jpg';
    cv.toBlob(function (b) {
      if (!b) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      cv.width = 0; cv.height = 0; S.thumb = ''; S.thumbPlate = '';
    }, 'image/jpeg', 0.6);
  } catch (e) {}
}

/* ================= RECORDS & CASH ================= */
function logsHome() {
  if (!can('records')) return home();
  var today = ymd(new Date()), full = can('mgmt');
  var pb = function (k, key) { return '<button class="btn plain slim" data-t="p-' + k + '" onclick="period(\'' + k + '\')">' + t(key) + '</button>'; };
  show('<h1>' + t('records') + '</h1>' +
    '<button class="btn green" data-t="cash" onclick="summary()">' + t('cash') + '</button>' +
    '<div class="row2">' + pb('today', 'pToday') + pb('yesterday', 'pYest') + '</div>' +
    '<div class="row2">' + pb('week', 'pWeek') + pb('month', 'pMonth') + '</div>' +
    '<div class="row2">' + pb('lastmonth', 'pLast') + (full ? pb('year', 'pYear') : '') + '</div>' +
    '<div class="box"><div class="row2"><div><label class="f">' + t('from') + '</label><input id="lf" type="date" value="' + today + '"></div>' +
    '<div><label class="f">' + t('to') + '</label><input id="lt" type="date" value="' + today + '"></div></div>' +
    '<label class="f">' + t('vehNo') + '</label><div class="row2"><input id="lq" class="up" type="text" autocapitalize="characters" placeholder="1234" oninput="plateTyped(this)">' +
    '<button class="btn dark mic" onclick="mic(\'lq\',\'plate\',this)">🎤</button></div>' +
    '<button class="btn slim" data-t="search" onclick="logsSearch()">' + t('search') + '</button></div>' +
    (can('su') ? '<button class="btn dark slim" data-t="analytics" onclick="anHome()">' + t('analytics') + '</button>' : '') +
    '<button class="btn grey slim" onclick="home()">' + t('back') + '</button>', 'logs');
}
function range(k) {
  var a = new Date(), b = new Date();
  if (k === 'yesterday') { a.setDate(a.getDate() - 1); b.setDate(b.getDate() - 1); }
  if (k === 'week') { a.setDate(a.getDate() - ((a.getDay() + 6) % 7)); }
  if (k === 'month') { a.setDate(1); }
  if (k === 'lastmonth') { a = new Date(a.getFullYear(), a.getMonth() - 1, 1); b = new Date(b.getFullYear(), b.getMonth(), 0); }
  if (k === 'year') { a = new Date(a.getFullYear(), 0, 1); }
  if (k === '30') { a.setDate(a.getDate() - 29); }
  return [ymd(a), ymd(b)];
}
function period(k) { var r = range(k); logsRun({ mode: 'past', from: r[0], to: r[1], q: '' }); }
function logsSearch() {
  var f = $('lf').value, to = $('lt').value;
  if (f && to && f > to) { var x = f; f = to; to = x; }
  logsRun({ mode: 'past', from: f, to: to, q: $('lq').value });
}
function logsRun(opt) {
  S.logOpt = opt;
  busy();
  call('apiLogs', S.pin, opt).then(function (r) { S.logs = r.list; logsList(r); }).catch(function (e) { fail(e, 'logsHome()'); });
}
function statusTag(x) {
  if (x.status === 'CANCELLED') return '<b class="tag x">' + t('n_DELETED') + '</b>';
  if (x.status === 'PARKED') return '<b class="tag">' + t('parkedTag') + '</b>';
  if (x.status === 'INSIDE') return '<b class="tag b">' + t('inTag') + '</b>';
  return x.note ? '<b class="tag x">' + noteName(x.note) + '</b>' : '';
}
function logsList(r) {
  var o = S.logOpt, title = o.mode === 'past' ? r.from + (r.to !== r.from ? ' → ' + r.to : '') + (norm(o.q) ? ' · ' + norm(o.q) : '') : norm(o.q);
  var h = '<h1>' + esc(title) + '</h1><div class="box">' + t('vehicles') + '<div class="huge">' + r.count + '</div>' + t('feesRef', r.fees, r.refunds) +
    (r.count > r.list.length ? '<br><small>' + t('latestN', r.list.length) + '</small>' : '') + '</div>';
  if (!r.list.length) h += '<div class="msg info">' + t('noRec') + '</div>';
  r.list.forEach(function (x, i) {
    h += '<button class="veh" onclick="logDetail(' + i + ')">' + esc(x.plate) + '<span>' + (x.serial != null ? '#' + esc(x.serial) + ' · ' : '') + catTag(x.cat) + ' ' + fmt(x.entry) +
      '<br>🅿️ ' + dur(x.pmin) + ' · ₹' + (x.fee || 0) + ' ' + statusTag(x) + '</span></button>';
  });
  S.lastLogs = r;
  show(h + '<button class="btn grey slim" onclick="logsHome()">' + t('back') + '</button>', 'loglist');
}
function logDetail(i) {
  var x = S.logs[i];
  var inComplex = x.entry ? Math.ceil(((x.exit || now()) - x.entry) / 60000) : 0;
  var row = function (a, b) { return '<tr><td>' + a + '</td><td>' + b + '</td></tr>'; };
  var who = function (tm, by) { return fmt(tm) + (by ? '<br><small>' + esc(by) + '</small>' : ''); };
  var h = '<div class="box"><div class="plate">' + esc(x.plate) + '</div>' + catTag(x.cat) + ' ' + (statusTag(x) || '<b class="tag g">' + t('outTag') + '</b>') + '</div><table>' +
    (x.serial != null ? row(t('rSerial'), '#' + esc(x.serial)) : '') +
    row(t('typeRow'), tk('ty_', x.type)) + row(t('slipRow'), x.slip === '' ? '—' : esc(x.slip)) +
    row(t('rIn'), who(x.entry, x.entryBy)) + row(t('rPs'), who(x.pstart, x.pstartBy)) + row(t('rPe'), who(x.pend, x.pendBy)) + row(t('rOut'), who(x.exit, x.exitBy)) +
    row(t('rPt'), '<b>' + dur(x.pmin) + '</b>') + row(t('rCt'), '<b>' + dur(inComplex) + '</b>') +
    row(t('depositRow'), '₹' + x.deposit) + (x.banked ? row(t('rBank'), '₹' + x.banked) : '') + row(t('fee'), x.fee == null ? '—' : '₹' + x.fee) +
    row(t('refRow'), x.refund == null ? '—' : x.refund >= 0 ? '↩️ ₹' + x.refund : '🤲 ₹' + (-x.refund)) + '</table>';
  h += '<button class="btn dark slim" onclick="vehicleCard(\'' + esc(x.plate) + '\')">' + t('openVeh') + '</button>' +
    '<button class="btn grey slim" onclick="logsList(S.lastLogs)">' + t('back') + '</button>';
  show(h, 'logdetail');
}
function summary() {
  busy();
  call('apiSummary', S.pin).then(function (r) {
    var h = '<h1>' + t('cash') + '</h1><div class="box">' + t('sumLine', r.entries, r.inside, r.parked) +
      (r.full ? '<br>' + t('feesToday', r.fees) : '') +
      (r.totalEver != null ? '<br>' + t('totals', r.totalEver, r.slipsLeft) : '') + '</div>';
    r.staff.forEach(function (x) {
      h += '<div class="box"><b>' + esc(x.name) + '</b><div class="huge">₹' + x.cash + '</div>' + t('cashInHand') + '<br>' +
        '<small>' + t('cashCalc', x.deposits, x.refunds, x.collected) + '</small></div>';
    });
    if (!r.staff.length) h += '<div class="msg info">' + t('noTx') + '</div>';
    show(h + '<button class="btn grey slim" onclick="logsHome()">' + t('back') + '</button>', 'summary');
  }).catch(function (e) { fail(e, 'logsHome()'); });
}

/* ================= ADVANCED ANALYTICS (superuser) ================= */
/* Row layout from the server: 0 plate, 1 size, 2 type, 3 entry ms, 4 exit ms, 5 parked min, 6 fee, 7 refund,
   8 deposit, 9 status, 10 note, 11 entry by, 12 exit by, 13 serial, 14 earlier-days fee, 15 parking by */
function anHome() { anLoad(range('month')); }
function anLoad(r) {
  busy(t('loadingData'));
  call('apiAnalytics', S.pin, r[0], r[1]).then(function (d) {
    S.an = { d: d, f: { cat: '', st: '', staff: '', q: '' }, sort: 3, desc: true, page: 0 };
    anShow();
  }).catch(function (e) { fail(e, 'logsHome()'); });
}
function anStatus(r) {
  if (r[9] === 'CANCELLED') return 'DEL';
  if (r[9] === 'INSIDE' || r[9] === 'PARKED') return 'IN';
  if (String(r[10]).indexOf('LEFT') === 0) return 'LEFT';
  return 'OUT';
}
function anRows() {
  var a = S.an, f = a.f, q = norm(f.q);
  return a.d.rows.filter(function (r) {
    if (f.cat && r[1] !== f.cat) return false;
    if (f.st === 'EX') { if (r[2] !== 'TENANT' && r[2] !== 'PASS') return false; }
    else if (f.st === 'PK') { if (!(r[5] > 0 || r[14] > 0)) return false; }
    else if (f.st && anStatus(r) !== f.st) return false;
    if (f.staff && r[11] !== f.staff && r[12] !== f.staff && r[15] !== f.staff) return false;
    if (q && r[0].indexOf(q) < 0) return false;
    return true;
  });
}
/* Simple bar chart drawn as SVG. items: [[label, value], ...] */
function bars(title, items, rupees) {
  if (!items.length) return '';
  var max = 1, Wd = 320, H = 130, n = items.length, bw = (Wd - 10) / n, s = '';
  items.forEach(function (it) { if (it[1] > max) max = it[1]; });
  var step = Math.ceil(n / 8);
  items.forEach(function (it, i) {
    var bh = Math.round(it[1] / max * (H - 34)), x = 5 + i * bw;
    s += '<rect x="' + x.toFixed(1) + '" y="' + (H - 18 - bh) + '" width="' + Math.max(1, bw - 2).toFixed(1) + '" height="' + bh + '" fill="#1f5fbf"><title>' + esc(it[0]) + ': ' + it[1] + '</title></rect>';
    if (i % step === 0) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 5) + '" font-size="9" text-anchor="middle" fill="#555">' + esc(it[0]) + '</text>';
    if (n <= 12 && it[1]) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 21 - bh) + '" font-size="9" text-anchor="middle" fill="#111">' + it[1] + '</text>';
  });
  return '<div class="chart"><b>' + title + '</b> <small>(' + t('max') + ' ' + (rupees ? '₹' : '') + max + ')</small><svg viewBox="0 0 ' + Wd + ' ' + H + '" width="100%">' + s + '</svg></div>';
}
function anShow() {
  var a = S.an, d = a.d, rows = anRows(), f = a.f;
  var fees = 0, refunds = 0, parked = 0, pmin = 0, left = 0, leftRs = 0, del = 0, inside = 0, heavy = 0;
  var byDay = {}, byHour = [], staff = {}, veh = {}, i;
  for (i = 0; i < 24; i++) byHour.push(0);
  var st = function (n) { if (!n) n = '—'; if (!staff[n]) staff[n] = { e: 0, x: 0, fee: 0, p: 0 }; return staff[n]; };
  var longRange = (new Date(d.to) - new Date(d.from)) / 86400000 > 45;
  rows.forEach(function (r) {
    var s = anStatus(r), dt = new Date(r[3]), key = longRange ? dt.getFullYear() + '-' + p2(dt.getMonth() + 1) : dt.getDate() + '/' + (dt.getMonth() + 1);
    if (!byDay[key]) byDay[key] = { n: 0, fee: 0, t: r[3] };
    if (s === 'DEL') { del++; return; }
    byDay[key].n++; byDay[key].fee += r[6]; byHour[dt.getHours()]++;
    fees += r[6]; if (r[7] > 0) refunds += r[7];
    if (r[5] > 0 || r[14] > 0) { parked++; pmin += r[5]; }
    if (s === 'LEFT') { left++; leftRs += r[6]; }
    if (s === 'IN') inside++;
    if (r[1] === 'HEAVY') heavy++;
    st(r[11]).e++; if (r[12] && s !== 'IN') { st(r[12]).x++; st(r[12]).fee += r[6]; } if (r[15]) st(r[15]).p++;
    if (!veh[r[0]]) veh[r[0]] = { n: 0, fee: 0 }; veh[r[0]].n++; veh[r[0]].fee += r[6];
  });
  var total = rows.length - del;
  var names = {}; d.rows.forEach(function (r) { [r[11], r[12], r[15]].forEach(function (n) { if (n) names[n] = 1; }); });
  var opt = function (v, label, cur) { return '<option value="' + esc(v) + '"' + (cur === v ? ' selected' : '') + '>' + esc(label) + '</option>'; };
  var pb = function (k, key) { return '<button class="btn plain slim" style="margin:4px 0" onclick="anLoad(range(\'' + k + '\'))">' + t(key) + '</button>'; };
  var h = '<h1>' + t('analytics') + '</h1><div class="msg info">' + d.from + ' → ' + d.to + (d.capped ? ' · ' + t('capped') : '') + '</div>' +
    '<div class="row2">' + pb('today', 'pToday') + pb('week', 'pWeek') + pb('month', 'pMonth') + '</div><div class="row2">' + pb('30', 'p30') + pb('lastmonth', 'pLast') + pb('year', 'pYear') + '</div>' +
    '<div class="row2"><input id="af" type="date" value="' + d.from + '"><input id="at" type="date" value="' + d.to + '"><button class="btn slim" style="flex:0 0 60px;margin:0" onclick="anLoad([$(\'af\').value,$(\'at\').value])">▶</button></div>' +
    '<h2>' + t('filters') + '</h2><div class="row2"><select id="fc" onchange="anSet()">' + opt('', t('allSizes'), f.cat) + opt('MEDIUM', t('c_MEDIUM'), f.cat) + opt('HEAVY', t('c_HEAVY'), f.cat) + '</select>' +
    '<select id="fs" onchange="anSet()">' + opt('', t('allStatus'), f.st) + opt('IN', t('stIn'), f.st) + opt('OUT', t('stOut'), f.st) + opt('PK', t('stPk'), f.st) + opt('LEFT', t('stLeft'), f.st) + opt('DEL', t('stDel'), f.st) + opt('EX', t('stEx'), f.st) + '</select></div>' +
    '<div class="row2" style="margin-top:8px"><select id="fp" onchange="anSet()">' + opt('', t('allStaff'), f.staff) + Object.keys(names).map(function (n) { return opt(n, n, f.staff); }).join('') + '</select>' +
    '<input id="fq" class="up note" type="text" placeholder="' + t('vehNo') + '" value="' + esc(f.q) + '" onchange="anSet()"></div>';
  var kpi = function (v, l) { return '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>'; };
  h += '<h2>' + t('summaryH') + '</h2><div class="kpis">' + kpi(total, t('vehicles')) + kpi('₹' + fees, t('kFees')) + kpi('₹' + refunds, t('kRef')) + kpi(parked + ' (' + (total ? Math.round(parked * 100 / total) : 0) + '%)', t('kPk')) +
    kpi(dur(parked ? Math.round(pmin / parked) : 0), t('kAvg')) + kpi('₹' + (parked ? Math.round(fees / parked) : 0), t('kFpp')) +
    kpi(left + ' · ₹' + leftRs, t('kLeft')) + kpi(heavy + ' / ' + (total - heavy), t('kHm')) + kpi(inside, t('kIn')) + kpi(del + ' · ' + d.review.length, t('kDel')) + '</div>';
  var days = Object.keys(byDay).sort(function (x, y) { return byDay[x].t - byDay[y].t; });
  h += bars(longRange ? t('chFeeMon') : t('chFeeDay'), days.map(function (k) { return [k, byDay[k].fee]; }), true) +
    bars(longRange ? t('chVehMon') : t('chVehDay'), days.map(function (k) { return [k, byDay[k].n]; })) +
    bars(t('chHour'), byHour.map(function (v, i2) { return [String(i2), v]; }));
  h += '<h2>' + t('staff') + '</h2><table><tr><th>' + t('name') + '</th><th>⬇️</th><th>🅿️</th><th>⬆️</th><th>₹</th></tr>' + Object.keys(staff).map(function (n) {
    var z = staff[n]; return '<tr><td>' + esc(n) + '</td><td>' + z.e + '</td><td>' + z.p + '</td><td>' + z.x + '</td><td>' + z.fee + '</td></tr>'; }).join('') + '</table>';
  var top = Object.keys(veh).sort(function (x, y) { return veh[y].fee - veh[x].fee || veh[y].n - veh[x].n; }).slice(0, 10);
  h += '<h2>' + t('topVeh') + '</h2><table><tr><th>' + t('colVeh') + '</th><th>' + t('times') + '</th><th>₹</th></tr>' + top.map(function (p) {
    return '<tr><td><a href="#" onclick="vehicleCard(\'' + p + '\');return false">' + p + '</a></td><td>' + veh[p].n + '</td><td>' + veh[p].fee + '</td></tr>'; }).join('') + '</table>';
  // sortable table
  var cols = [[0, t('colVeh')], [1, t('colSize')], [3, t('colIn')], [4, t('colOut')], [5, t('colPk')], [6, '₹'], [11, t('colBy')]];
  rows.sort(function (x, y) { var u = x[a.sort], v = y[a.sort]; if (u == null) u = 0; if (v == null) v = 0; return (u < v ? -1 : u > v ? 1 : 0) * (a.desc ? -1 : 1); });
  var per = 50, pages = Math.max(1, Math.ceil(rows.length / per));
  if (a.page >= pages) a.page = 0;
  h += '<h2>' + t('allRows') + ' — ' + rows.length + '</h2><div class="scroll"><table><tr>' + cols.map(function (c) {
    return '<th class="s" onclick="anSort(' + c[0] + ')">' + c[1] + (a.sort === c[0] ? (a.desc ? ' ▼' : ' ▲') : '') + '</th>'; }).join('') + '</tr>' +
    rows.slice(a.page * per, a.page * per + per).map(function (r) {
      var s = anStatus(r);
      return '<tr><td><a href="#" onclick="vehicleCard(\'' + r[0] + '\');return false">' + r[0] + '</a>' + (s === 'LEFT' ? ' ✖' : s === 'DEL' ? ' 🗑' : s === 'IN' ? ' ●' : '') + '</td><td>' + catName(r[1]) + '</td><td>' + fmt(r[3]) +
        '</td><td>' + (r[4] ? fmt(r[4]) : '—') + '</td><td>' + r[5] + '</td><td>' + r[6] + '</td><td>' + esc(r[11]) + '</td></tr>'; }).join('') + '</table></div>' +
    '<div class="row2"><button class="btn plain slim" onclick="anPage(-1)">◀</button><div class="box" style="margin:10px 0;padding:12px">' + (a.page + 1) + ' / ' + pages + '</div><button class="btn plain slim" onclick="anPage(1)">▶</button></div>' +
    '<button class="btn dark slim" data-t="csv" onclick="anCsv()">' + t('csv') + '</button>' +
    '<button class="btn grey slim" onclick="logsHome()">' + t('back') + '</button>';
  var y = window.scrollY, keep = S.screen === 'analytics';
  show(h, 'analytics');
  if (keep) window.scrollTo(0, y);
}
function anSet() { var f = S.an.f; f.cat = $('fc').value; f.st = $('fs').value; f.staff = $('fp').value; f.q = $('fq').value; S.an.page = 0; anShow(); }
function anSort(c) { var a = S.an; if (a.sort === c) a.desc = !a.desc; else { a.sort = c; a.desc = true; } a.page = 0; anShow(); }
function anPage(n) { var a = S.an, pages = Math.max(1, Math.ceil(anRows().length / 50)); a.page = Math.min(pages - 1, Math.max(0, a.page + n)); anShow(); }
function anCsv() {
  var head = ['Vehicle', 'Size', 'Type', 'Entry', 'Exit', 'Parked min', 'Fee', 'Refund', 'Deposit', 'Status', 'Note', 'Entry by', 'Exit by', 'Serial', 'Earlier days fee', 'Parking by'];
  var iso = function (tm) { if (!tm) return ''; var d = new Date(tm); return ymd(d) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
  var lines = [head.join(',')].concat(anRows().map(function (r) {
    return r.map(function (v, i) { if (i === 3 || i === 4) v = iso(v); v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
  }));
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv' }));
    a.download = 'globe_parking_' + S.an.d.from + '_' + S.an.d.to + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alertMsg(t('dlFail')); }
}

/* ================= start ================= */
(function () {
  var saved = '';
  window.addEventListener('beforeunload', function (e) { if (S.q.length) { e.preventDefault(); e.returnValue = ''; } });
  try {
    saved = localStorage.getItem('gp_pin') || '';
    S.voice = localStorage.getItem('gp_voice') !== '0';
    var l = localStorage.getItem('gp_lang'); if (LANGS.indexOf(l) >= 0) S.lang = l;
  } catch (e) {}
  document.documentElement.lang = S.lang;
  var started = false, go = function () { if (started) return; started = true; if (saved) boot(saved); else loginScreen(); };
  if (!inAppsScript() && !/^https:/.test(API_URL)) {      // hosted page: read config.js first
    var sc = document.createElement('script');
    sc.src = 'config.js?v=' + Date.now(); sc.onload = go; sc.onerror = go;
    document.head.appendChild(sc);
    setTimeout(go, 4000);
  } else go();
})();

</script>
